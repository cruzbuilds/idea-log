services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: idealog
      POSTGRES_PASSWORD: idealog
      POSTGRES_DB: idealog
    ports:
      - "5432:5432"
    volumes:
      - idealog_pgdata:/var/lib/postgresql/data

volumes:
  idealog_pgdata:
